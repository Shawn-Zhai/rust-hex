[package]
name = "hex"
version = "0.4.3"
edition = "2018"
rust-version = "1.85"
description = "hex 0.4.3 (main @ e25a870) annotated for Verus; see README.md"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["std"]
alloc = []
std = ["alloc"]
serde = ["dep:serde"]

[dependencies]
# Only for the plain `cargo build`/`cargo test` (the `verus!` macro and `vstd::prelude`).
# Verification uses the bare `verus` binary with its bundled vstd; `cargo verus` panics with
# every crates.io vstd for Verus 0.2026.05.03.
vstd = "=0.0.0-2026-05-06-1803"
serde = { version = "1.0", default-features = false, optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)'] }
